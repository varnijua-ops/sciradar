<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciRadar Editorial — Diario Científico & Monitor en Tiempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif']
          },
          colors: {
            slate: { 850: '#151f32', 950: '#080d18' }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-slate-950">

  <!-- CABECERA PRINCIPAL -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
            <svg class="w-6 h-6 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
              SciRadar <span class="font-serif italic font-normal text-cyan-400">Editorial</span>
            </h1>
            <p class="text-xs text-slate-400">Informes explicados para el lector y conexión directa con arXiv, Nature, Science y PubMed</p>
          </div>
        </div>

        <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800">
          <button id="tabEditorialBtn" onclick="switchMainView('editorial')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-cyan-500 text-slate-950 shadow">
            🗞️ Portada Editorial (Informes IA)
          </button>
          <button id="tabLiveBtn" onclick="switchMainView('live')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition text-slate-300 hover:text-white">
            📡 Radar en Vivo (RSS / APIs)
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <div class="relative flex-1 sm:w-56">
          <input id="searchInput" type="text" placeholder="Buscar tema, gen, misión..." class="w-full bg-slate-800/90 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-cyan-400" />
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <button onclick="openImportModal()" class="flex items-center gap-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 font-semibold text-xs px-3 py-1.5 rounded-lg transition">
          <span>📥 Importar Informe</span>
        </button>

        <button id="autoTranslateBtn" onclick="toggleAutoTranslate()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-3 py-1.5 rounded-lg transition">
          <span>🌐 Traducir feed al ES: <strong id="translateStatus">OFF</strong></span>
        </button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 pb-3 flex items-center gap-2 overflow-x-auto" id="categoryBar"></div>
  </header>

  <!-- SECCIÓN 1: PORTADA EDITORIAL -->
  <section id="editorialSection" class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-6 mb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2 text-xs text-cyan-400 font-semibold uppercase tracking-wider">
          <span>Edición Especial de Divulgación Científica</span>
          <span>•</span>
          <span id="currentEditionDate">Actualizado en Vivo</span>
        </div>
        <h2 id="currentEditionTitle" class="text-2xl sm:text-3xl font-serif font-bold text-white mt-1">
          Panorama Global de Avances Científicos
        </h2>
      </div>

      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-400">Hemeroteca de informes:</label>
        <select id="editionSelector" onchange="selectEdition(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-cyan-400"></select>
      </div>
    </div>

    <div id="editorialHero" class="mb-8"></div>
    <div id="editorialGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </section>

  <!-- SECCIÓN 2: RADAR EN TIEMPO REAL -->
  <section id="liveSection" class="hidden max-w-7xl mx-auto px-4 py-6">
    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2 overflow-x-auto" id="providerBar"></div>
      <div class="flex items-center gap-3 text-xs">
        <span id="statusText" class="text-slate-400">Cargando fuentes científicas...</span>
      </div>
    </div>
    <div id="liveGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </section>

  <!-- MODAL DE LECTURA -->
  <div id="readerModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span id="readerBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300"></span>
          <span id="readerSource" class="text-xs text-slate-400"></span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="adjustFontSize(-1)" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded text-slate-300">A-</button>
          <button onclick="adjustFontSize(1)" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded text-slate-300">A+</button>
          <button onclick="close
