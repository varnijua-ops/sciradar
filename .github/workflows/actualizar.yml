name: Actualizar SciRadar Automático

on:
  schedule:
    - cron: '0 8,18 * * *' # Se ejecuta todos los días a las 08:00 y 18:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  actualizar:
  runs-on: ubuntu-latest
  steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Ejecutar script de actualización
      run: python actualizar_radar.py

    - name: Commit y Push de los cambios a GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add noticias_auto.json
        git commit -m "Actualización automática de noticias científicas [skip ci]" || echo "No hay cambios para guardar"
        git push
