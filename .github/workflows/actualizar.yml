name: Actualizar SciRadar Automático

on:
  schedule:
    - cron: - cron: '0 * * * *' # Se ejecuta cada 1 hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install --no-cache-dir feedparser requests

      - name: Ejecutar script de actualización
        run: python actualizar_radar.py

      - name: Commit y Push de los cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias_auto.json
          git commit -m "Actualización automática de noticias científicas [skip ci]" || echo "No hay cambios para guardar"
          git push
